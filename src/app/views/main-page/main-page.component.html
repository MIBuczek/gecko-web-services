<app-header></app-header>
<section class="about container my-5 py-5">
  <div class="row">
    <div class="col-lg-6 pt-5 pt-lg-0 d-flex flex-column justify-content-center about-title">
      <h1>Elegant and creative solutions</h1>
      <h2>We are team of talented designers making websites with Bootstrap</h2>
    </div>
    <div class="col-lg-6 hero-img">
      <img src="../../../assets/images/main_programming.svg" alt="developer">
    </div>
  </div>
</section>
<section class="service container-fluid my-5">
  <div class="container text-center">
    <div class="service-title d-flex flex-column justify-content-center align-items-center my-5">
      <span>{{"main-page.main_header" | translate}}</span>
      <h1>{{"main-page.main_header" | translate}}</h1>
      <h2>{{"main-page.intro" | translate}}</h2>
    </div>
    <div class="row">
      <div
        class="col-lg-4 col-md-6 d-flex align-items-stretch mt-4 mt-lg-0"
        *ngFor="let card of 'main-page.cards' | translate ; let index = index">
        <div class="card-wrapper">
          <app-service-card
            [cardIndex]="index"
            [cardContent]="card"
            [cardBtn]="'main-page.btn.more' | translate"
            (emitIsOpen)="setCardStatus(card)">
          </app-service-card>
        </div>
      </div>
    </div>
  </div>
</section>
<app-footer></app-footer>
