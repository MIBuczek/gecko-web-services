<app-header></app-header>
<section class="service container-fluid my-5">
  <div class="container text-center">
    <div class="service-title d-flex flex-column justify-content-center my-5">
      <span>{{"main-page.main_header" | translate}}</span>
      <h1>{{"main-page.main_header" | translate}}</h1>
      <p>{{"main-page.intro" | translate}}</p>
    </div>
    <div class="row">
      <div
        class="col-lg-4 col-md-6 d-flex align-items-stretch mt-4 mt-lg-0"
        *ngFor="let card of 'main-page.cards' | translate ; let index = index">
        <div class="card-wrapper">
          <app-service-card
            [cardIndex]="index"
            [cardContent]="card"
            [cardBtn]="'main-page.btn.more' | translate"
            (emitIsOpen)="setCardStatus(card)">
          </app-service-card>
        </div>
      </div>
    </div>
  </div>
</section>
<app-footer></app-footer>
