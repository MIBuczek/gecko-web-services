<app-header></app-header>
<section class="service container-fluid my-5">
  <div class="container text-center">
    <div class="service-title d-flex flex-column justify-content-center my-5">
      <span>{{sctc[lang | async].main_header}}</span>
      <h1>{{sctc[lang | async].main_header}}</h1>
      <p>{{sctc[lang | async].intro}}</p>
    </div>
    <div class="row">
      <div
        class="col-lg-4 col-md-6 d-flex align-items-stretch mt-4 mt-lg-0"
        *ngFor="let card of sctc[lang | async].cards ; let index = index">
        <div class="card-wrapper">
          <app-service-card
            [cardIndex]="index"
            [cardContent]="card"
            [cardBtn]="sctc[lang | async].btn.more"
            (emitIsOpen)="setOpenCard($event)">
          </app-service-card>
        </div>
      </div>
    </div>
    <app-service-card-details
      *ngIf="isOpenCard(currentOpenCardIndex)"
      [cardIndex]="currentOpenCardIndex"
      [cardContent]="sctc[(currentLang$ | async) || 'PL'].cards[currentOpenCardIndex]"
      [cardBtn]="sctc[(currentLang$ | async) || 'PL'].btn.hide"
      (emitIsHide)="setOpenCard($event)">>
    </app-service-card-details>
  </div>

</section>
<app-footer></app-footer>
