<main class="container-fluid d-flex p-0">
  <div
    class="container d-flex flex-column justify-content-center align-items-center p-0"
  >
    <span class="header-shadow">Panel Logowania</span>
    <h1>Panel Logowania</h1>
    <form
      [formGroup]="logInForm"
      class="d-flex flex-column justify-center align-items-center"
      (ngSubmit)="onSubmit()"
    >
      <div class="mt-3 col-8 col-md-6">
        <input
          class="form-control mb-3"
          placeholder="e-mail"
          type="email"
          name="email"
          id="email"
          [formControl]="logInForm.controls.email"
          ngDefaultControl
        />
        <app-error-message [form]="logInForm" [fieldName]="'email'" />
        <input
          class="form-control mb-4"
          placeholder="password"
          type="password"
          name="password"
          id="password"
          [formControl]="logInForm.controls.password"
          ngDefaultControl
        />
        <app-error-message [form]="logInForm" [fieldName]="'password'" />
        <button
          color="primary"
          type="submit"
          class="w-100"
          [disabled]="logInForm.invalid"
        >
          Zaloguj
        </button>
      </div>
    </form>
    <div class="col-10 col-lg-6" *ngIf="loginError | async">
      <app-notification
        [title]="'Nieudana próba logowania.'"
        [variant]="'error'"
      >
        <p class="login-redirect">
          {{ loginError | async | json }}
        </p>
      </app-notification>
    </div>
    <div class="col-10 col-lg-6">
      <app-notification
        [title]="'Panel dostępny tylko dla administratorow.'"
        [variant]="'warning'"
      >
        <p class="login-redirect mt-1 mb-0">
          Jeżeli trafiłeś tu przypadkiem, mozesz powrócić na
          <a routerLink="/main-page">strone glowna.</a>
        </p>
      </app-notification>
    </div>
  </div>
</main>
