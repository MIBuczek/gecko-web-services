<app-navigation></app-navigation>
<app-breadcrumbs></app-breadcrumbs>
<main class="d-flex flex-column justify-content-center">
  <section id="header" class="header container">
    <div class="row justify-content-center align-items-center">
      <header class="col-lg-12 d-flex flex-column align-items-center">
        <div class="h-title-shadow">
          <span>GECKO Web Services</span>
        </div>
        <div class="h-title">
          <h1>GECKO</h1>
          <h3>Web Services</h3>
        </div>
        <div class="h-logo d-flex justify-content-center align-items-center">
          <img src="./assets/images/logo-gws.png" alt="Logo Gecko Web Services">
        </div>
      </header>
    </div>
  </section>
  <section
    id="about"
    class="about container my-5 pb-5 d-flex justify-content-center align-items-center"
  >
    <div class="row w-100">
      <div
        class="col-lg-6 pt-5 pt-lg-0 d-flex flex-column justify-content-center about-title"
      >
        <h1>{{ "main-page.about_header" | translate }}</h1>
        <h2>{{ "main-page.about_intro" | translate }}</h2>
      </div>
      <div class="col-lg-6 hero-img">
        <img
          src="../../../assets/images/main_programming.svg"
          alt="developer"
        />
      </div>
    </div>
  </section>
  <section id="service" class="service container-fluid my-5">
    <div class="container text-center">
      <div
        class="service-title d-flex flex-column justify-content-center align-items-center my-5"
      >
        <span>{{ "main-page.service_header" | translate }}</span>
        <h1>{{ "main-page.service_header" | translate }}</h1>
        <h2>{{ "main-page.service_intro" | translate }}</h2>
      </div>
      <div class="card-container row">
        <div
          class="col-lg-4 col-md-6 col-sm-12 d-flex align-items-stretch mt-4 mt-lg-0"
          *ngFor="let card of 'main-page.cards' | translate; let index = index"
        >
          <div class="card-wrapper">
            <app-service-card
              [cardIndex]="index"
              [cardContent]="card"
              [cardBtn]="'main-page.btn.more' | translate"
              (emitIsOpen)="setCardStatus(card)"
            >
            </app-service-card>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section id="contact" class="technologies container-fluid px-2 py-sm-3 py-md-5">
    <div class="container">
      <div class="technologies-icons row d-flex justify-content-evenly align-items-center flex-wrap">
        <i
          *ngFor="let icon of tech_icons; last as isLast"
          class="d-flex justify-content-center align-items-center fa-brands col-md-1 m-2"
          [class.col-2]="!isLast"
          [class.col-1]="isLast"
          [ngClass]="icon"
        ></i>
      </div>
    </div>
  </section>
  <app-footer></app-footer>
</main>
<app-loader></app-loader>
<app-cookie></app-cookie>
<app-scroll-top></app-scroll-top>
<app-copy-rights></app-copy-rights>
