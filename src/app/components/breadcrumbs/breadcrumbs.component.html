@if (breadcrumbs(); as breadcrumbs) {
  @if (breadcrumbs.length > 1) {
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb py-3">
          @for (path of breadcrumbs; track path; let last = $last) {
            <li class="breadcrumb-item">
              @if (availableRouts.includes(path.rout)) {
                <a
                  [routerLink]="['', convertToString(path.rout)]"
                  [ngClass]="{ disabled: last }"
                  >
                  {{ "breadcrumbs." + path.rout | translate }}
                </a>
              } @else {
                <a [ngClass]="{ disabled: last }">{{ path.rout }}</a>
              }
            </li>
            @if (!last) {
              <i class="fa-solid fa-chevron-right"></i>
            }
          }
        </ol>
      </nav>
    </div>
  }
}
