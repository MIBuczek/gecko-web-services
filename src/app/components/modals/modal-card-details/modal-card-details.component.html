<div class="modal">
  <div
    class="card-details my-3 d-flex flex-column justify-content-between align-items-center"
    >
    <div class="icon"><i [class]="data.card.card_icon"></i></div>
    <h3 class="card-title">{{ data.card.card_header }}</h3>
    <p>{{ data.card.card_full_description }}</p>
    <div class="row d-flex w-100 justify-content-center">
      <hr />
      @for (tag of data.card.card_tags; track tag) {
        <span
          class="badge badge-secondary"
          >{{ tag }}</span
          >
        }
      </div>
      <button class="modal_btn text-center" type="button" (click)="hideCard()">
        {{ "main-page.btn.hide" | translate }}
      </button>
    </div>
  </div>
