<div class="modal">
  <div class="email-details my-3 d-flex flex-column align-items-start">
    <h3 class="email-title">
      e-mail : {{ data.email }}
      @if (data.replay) {
        <i class="fa-solid fa-check ms-2"></i>
      }
    </h3>
    <p class="p-0 created-at">sent at : {{ data.createdAt | date }}</p>
    <div class="row d-flex w-100 justify-content-center text-start">
      <hr />
      <h5 class="m-0 mb-2 fw-semibold">message :</h5>
      <p class="text-break">{{ data.message }}</p>
      <hr />
    </div>
    <div class="row d-flex w-100 justify-content-end">
      <button
        class="modal_btn-secondary text-center me-auto"
        type="button"
        [disabled]="data.replay"
        (click)="updateEmail()"
        >
        <i class="fa-solid fa-check"></i>
      </button>
      <button
        class="modal_btn-secondary text-center"
        type="button"
        (click)="deleteEmail()"
        >
        <i class="fa-solid fa-trash"></i>
      </button>
      <button
        class="modal_btn text-center"
        type="button"
        (click)="closeModal()"
        >
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>
</div>
