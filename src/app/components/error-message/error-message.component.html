@if (form && form.controls[fieldName].dirty) {
  @for (msg of form | formErrorMessage : fieldName : currentLang; track msg) {
    <div
      class="d-flex justify-content-center align-items-center invalid-feedback py-2"
      >
      {{ msg }}
      <i class="fa-solid fa-circle-exclamation p-1"></i>
    </div>
  }
}
