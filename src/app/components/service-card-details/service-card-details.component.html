<div class="card my-3 d-flex flex-column justify-content-between align-items-center full">
  <div class="icon"><i [class]="cardContent?.card_icon"></i></div>
  <h3>{{ cardContent?.card_header }}</h3>
  <p>{{ cardContent?.card_full_description }}</p>
  <button
    class="modal_btn text-center"
    type="button"
    (click)="hideCard()">
    {{ cardBtn }}
  </button>
</div>
