<footer>
  <div class="container contact">
    <div class="row justify-content-center">
      <div class="col-lg-6 contact-header text-center">
        <span>
          {{ textContent[currentLang]['title'] }}
        </span>
        <h3>
          {{ textContent[currentLang]['title'] }}
        </h3>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <p class="fs-m-6">
          {{textContent[currentLang]['description']}}
        </p>
        <div class="contact-links ">
          <p class="d-inline mr-3">
            <span>
              <i class="bx bi-phone"></i>
            </span>
            509-312-832
          </p>
          <p class="d-inline">
            <span>
              <i class="bx bi-envelope"></i>
            </span>
            gecko.web.services@gmail.com
          </p>
        </div>
      </div>
      <div class="col-lg-6 contact-form">
        <form class="row flex-md-row flex-column" [formGroup]="formUserMessage" (submit)="submit()">
          <div class="col-12 col-md-10 d-flex flex-column align-items-md-stretch align-items-center">
            <input
              type="email"
              name="email"
              formControlName="email"
              [placeholder]="textContent[currentLang].formEmail"
            >
            <ng-container *ngIf="formUserMessage.touched && formControls['email'].errors">
              <app-error-message
                *ngIf="formControls['email'].touched && formControls['email'].errors['required'] "
                [message]="errorMessages[currentLang]['required']"
              ></app-error-message>
              <app-error-message
                *ngIf="formControls['email'].errors['email']"
                [message]="errorMessages[currentLang]['email']"
              ></app-error-message>
              <app-error-message
                *ngIf="formControls['email'].errors['minlength']"
                [message]="errorMessages[currentLang]['minlength']"
              ></app-error-message>
            </ng-container>
            <textarea
              name="message"
              formControlName="message"
              [placeholder]="textContent[currentLang].formMessage"
            ></textarea>
            <ng-container *ngIf="formControls['message'].errors">
              <app-error-message
                *ngIf="formControls['message'].touched && formControls['message'].errors['required']"
                [message]="errorMessages[currentLang]['required']"
              ></app-error-message>
              <app-error-message
                *ngIf="formControls['message'].touched && formControls['message'].errors['minlength']"
                [message]="errorMessages[currentLang]['minlength']"
              ></app-error-message>
            </ng-container>
          </div>
          <div class="col-md-2 col-12">
            <input type="submit" [value]="textContent[currentLang].formBtn" [disabled]="!formUserMessage.touched">
          </div>
          <ng-container *ngIf="!!submitStatus$ && (submitClearStatus | async)">
            <p class="p-3 m-0 message-success text-success"
               *ngIf="( submitStatus$ | async) === dbMessageActions.SUCCESS">
              {{textContent[currentLang][dbMessageActions.SUCCESS]}}
              <span class="mx-1"><i class="bi bi-check-square"></i></span>
            </p>
            <p class="p-3 m-0 message-error text-danger" *ngIf="( submitStatus$ | async) === dbMessageActions.ERROR">
              {{textContent[currentLang][dbMessageActions.ERROR]}}
              <span class="mx-1"><i class="bi bi-exclamation-square"></i></span>
            </p>
          </ng-container>
        </form>
      </div>
    </div>
  </div>
</footer>
