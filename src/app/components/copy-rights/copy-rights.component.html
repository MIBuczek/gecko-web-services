    <div class="my-3 my-md-0">
      <a class="redirect-policy" routerLink="/privacy-policy">
        {{ "copy-rights.privacy-policy" | translate }}

    </div>

      </a>
      {{ "copy-rights.right-reserved" | translate }}

  </div>
