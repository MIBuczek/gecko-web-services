<div class="bd-callout row" [ngClass]="variant">
  <div
    class="col-2 d-flex justify-content-center align-items-center p-0"
    >
    @switch (variant) {
      @case ('warning') {
        <i class="fa-solid fa-triangle-exclamation"></i>
      }
      @case ('error') {
        <i class="fa-solid fa-circle-exclamation"></i>
      }
      @case ('success') {
        <i class="fa-regular fa-square-check"></i>
      }
      @default {
        <i class="fa-solid fa-circle-info"></i>
      }
    }
  </div>
  <div class="col-10 p-0 d-flex flex-column justify-content-center">
    <p class="m-0">
      <strong>{{ title }}</strong>
    </p>
    <ng-content selector="'notification-content'"></ng-content>
  </div>
</div>
