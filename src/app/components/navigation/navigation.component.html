<section class="container-fluid fixed-top" [class.sticky]="checkPosition(true)">
  <div class="container">
    <div class="row align-items-center justify-content-end test">
      <ng-container *ngIf="checkPosition(false)" >
        <button
        class="navbar-toggler m-lg-auto col-1 px-3"
        type="button"
        (click)="navbarToggle()">
        <i class="fa-solid fa-circle-chevron-down" [class.rotate]="isNavbarOpen"></i>
      </button>
      </ng-container>
      <nav
        class="navbar navbar-expand-lg"
        *ngIf="isNavbarOpen || !checkPosition(false)">
        <ul class="navbar-nav">
          <ng-container *ngIf="isMainPage; else replacementNavigation">
            <li class="nav-item" [class.active]="selectedContentId === 'start'">
              <a class="nav-link" role="button" (click)="scrollToElement('start')">
                {{'navigation.main' | translate}}
              </a>
            </li>
            <li class="nav-item" [class.active]="selectedContentId === 'about'">
              <a class="nav-link" role="button" (click)="scrollToElement('about')">
                {{'navigation.about' | translate}}
              </a>
            </li>
            <li class="nav-item" [class.active]="selectedContentId === 'service'">
              <a class="nav-link" role="button" (click)="scrollToElement('service')">
                {{'navigation.service' | translate}}
              </a>
            </li>
            <li class="nav-item" [class.active]="selectedContentId === 'contact'">
              <a class="nav-link" role="button" (click)="scrollToElement('contact')">
                {{'navigation.contact' | translate}}
              </a>
            </li>
          </ng-container>
          <ng-template #replacementNavigation>
            <li class="nav-item">
              <a class="nav-link" routerLink="/main-page">
                {{'navigation.main' | translate}}
              </a>
            </li>
          </ng-template>
          <li>
            <button class="lang-switcher" (click)="langToggle($event)">
              <img
                [src]="'../../../assets/flags/' + selectedLang.toUpperCase() + '.png'"
                alt="flag"
                class="img-fluid"
              />
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</section>
