<div
  *ngIf="cardContent"
  class="card my-3 d-flex flex-column justify-content-between align-items-center">
  <div class="icon"><i [class]="cardContent.card_icon"></i></div>
  <h3 class="service-card-title">{{ cardContent.card_header }}</h3>
  <p>{{ cardContent.card_short_description }}</p>
  <button
    class="modal_btn text-center"
    type="button"
    (click)="showCard($event)">
    {{ cardBtn }}
  </button>
</div>
